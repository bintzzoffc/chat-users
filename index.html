<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Sinyal — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0D1117;
    --surface: #151B23;
    --surface-2: #1D2530;
    --border: #262E3A;
    --accent: #E3B341;
    --accent-dim: #8A6E28;
    --text: #E6EDF3;
    --muted: #8B949E;
    --bubble-me: #22303F;
    --bubble-me-border: #33465C;
    --danger: #F0665A;
    --online: #3FB950;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .display{ font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }
  button{ font-family: inherit; }
  input{ font-family: inherit; }
  ::selection{ background: var(--accent-dim); color: #fff; }

  /* ---------- layout shells ---------- */
  #app{ height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
  .screen{ height: 100%; width: 100%; display: none; }
  .screen.active{ display: flex; }

  /* ---------- auth screen ---------- */
  #auth-screen{
    align-items: center; justify-content: center;
    background:
      radial-gradient(600px 300px at 50% -10%, rgba(227,179,65,0.10), transparent 60%),
      var(--bg);
    padding: 24px;
  }
  .auth-card{
    width: 100%; max-width: 380px;
  }
  .signal-mark{
    display:flex; align-items:flex-end; gap: 4px; height: 34px; margin-bottom: 22px;
  }
  .signal-mark span{
    width: 5px; border-radius: 3px;
    background: var(--accent);
    animation: wave 1.6s ease-in-out infinite;
  }
  .signal-mark span:nth-child(1){ height: 12px; animation-delay: 0s;}
  .signal-mark span:nth-child(2){ height: 24px; animation-delay: .15s;}
  .signal-mark span:nth-child(3){ height: 34px; animation-delay: .3s;}
  .signal-mark span:nth-child(4){ height: 20px; animation-delay: .45s;}
  .signal-mark span:nth-child(5){ height: 10px; animation-delay: .6s;}
  @keyframes wave{
    0%, 100%{ transform: scaleY(0.6); opacity:.6; }
    50%{ transform: scaleY(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .signal-mark span{ animation: none; }
  }
  .auth-card h1{ font-size: 28px; margin: 0 0 4px; }
  .auth-card p.sub{ color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input{
    width: 100%; padding: 12px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 15px; outline: none;
    transition: border-color .15s;
  }
  .field input:focus{ border-color: var(--accent); }
  .btn-primary{
    width: 100%; padding: 13px 14px; border-radius: 10px; border: none;
    background: var(--accent); color: #17130A; font-weight: 600; font-size: 15px;
    cursor: pointer; margin-top: 6px; transition: filter .15s, transform .1s;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:disabled{ opacity: .6; cursor: not-allowed; }
  .switch-mode{ text-align:center; margin-top: 18px; font-size: 14px; color: var(--muted); }
  .switch-mode button{
    background:none; border:none; color: var(--accent); cursor:pointer; font-size: 14px; font-weight: 600;
    padding: 0; margin-left: 4px;
  }
  .error-msg{
    background: rgba(240,102,90,0.1); border: 1px solid rgba(240,102,90,0.35);
    color: var(--danger); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px;
    display:none;
  }
  .error-msg.show{ display:block; }

  /* ---------- main app screen ---------- */
  #main-screen{ flex-direction: row; }
  #sidebar{
    width: 320px; min-width: 320px; height: 100%;
    border-right: 1px solid var(--border);
    display:flex; flex-direction: column;
    background: var(--surface);
  }
  #sidebar-header{
    padding: 18px 18px 12px; border-bottom: 1px solid var(--border);
    display:flex; align-items:center; justify-content: space-between;
  }
  #sidebar-header .brand{ display:flex; align-items:center; gap:8px; font-weight: 700; font-size: 18px; }
  #sidebar-header .brand .dot{ width:8px; height:8px; border-radius:50%; background: var(--online); box-shadow: 0 0 8px var(--online); }
  #me-tag{ font-size: 12px; color: var(--muted); }
  #logout-btn{
    background:none; border:1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor:pointer;
  }
  #logout-btn:hover{ color: var(--danger); border-color: var(--danger); }

  #search-wrap{ padding: 12px 14px; border-bottom: 1px solid var(--border); position: relative; }
  #search-input{
    width:100%; padding: 10px 12px; border-radius: 9px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text); font-size: 14px; outline:none;
  }
  #search-input:focus{ border-color: var(--accent); }
  #search-results{
    position: absolute; left: 14px; right: 14px; top: 54px; z-index: 5;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    max-height: 220px; overflow-y: auto; display:none; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #search-results.show{ display:block; }
  .search-item{
    padding: 10px 12px; cursor:pointer; font-size: 14px; display:flex; align-items:center; gap:10px;
    border-bottom: 1px solid var(--border);
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover{ background: var(--surface); }
  .search-empty{ padding: 12px; font-size: 13px; color: var(--muted); }

  #conv-list{ flex:1; overflow-y:auto; padding: 8px; }
  .conv-item{
    display:flex; align-items:center; gap: 12px; padding: 10px 10px; border-radius: 10px;
    cursor:pointer; margin-bottom: 2px;
  }
  .conv-item:hover{ background: var(--surface-2); }
  .conv-item.active{ background: var(--surface-2); }
  .avatar{
    width: 38px; height:38px; border-radius: 50%; background: var(--surface-2);
    border: 1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size: 14px; color: var(--accent); flex-shrink:0;
  }
  .conv-name{ font-size: 14px; font-weight: 600; }
  .conv-empty-hint{ color: var(--muted); font-size: 13px; padding: 16px 12px; line-height:1.5; }

  #chat-panel{ flex:1; display:flex; flex-direction: column; height:100%; min-width:0; }
  #chat-empty{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color: var(--muted); text-align:center; padding: 20px;
  }
  #chat-empty .signal-mark{ margin: 0 0 8px; opacity:.5; }

  #chat-header{
    display:none; align-items:center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #back-btn{
    display:none; background:none; border:none; color: var(--text); font-size: 20px; cursor:pointer; padding: 0 4px 0 0;
  }
  #chat-header .avatar{ width:34px; height:34px; }
  #chat-title{ font-weight:700; font-size:15px; }

  #messages{
    flex:1; overflow-y:auto; padding: 20px; display:none; flex-direction: column; gap: 4px;
  }
  .msg-row{ display:flex; margin-bottom: 6px; }
  .msg-row.me{ justify-content:flex-end; }
  .bubble{
    max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 14.5px; line-height:1.45;
    word-wrap: break-word; white-space: pre-wrap;
  }
  .msg-row.me .bubble{ background: var(--bubble-me); border: 1px solid var(--bubble-me-border); border-bottom-right-radius: 4px; }
  .msg-row.them .bubble{ background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-time{ font-size: 10px; color: var(--muted); margin-top: 3px; }
  .msg-row.me .msg-time{ text-align:right; }

  #composer{
    display:none; padding: 14px 20px; border-top: 1px solid var(--border); gap: 10px; background: var(--surface);
  }
  #composer-main{ flex:1; min-width:0; }
  #composer-input{
    width:100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text); font-size: 14.5px; outline:none; resize:none;
    max-height: 120px;
  }
  #composer-input:focus{ border-color: var(--accent); }
  #send-btn{
    width: 44px; height: 44px; border-radius: 10px; border:none; background: var(--accent);
    color: #17130A; font-weight:700; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  #send-btn:hover{ filter: brightness(1.08); }

  /* ---------- responsive ---------- */
  @media (max-width: 760px){
    #sidebar{ width: 100%; min-width: 0; }
    #main-screen.chat-open #sidebar{ display:none; }
    #main-screen:not(.chat-open) #chat-panel{ display:none; }
    #back-btn{ display:inline-block; }
  }

  /* ---------- premium glass + grid upgrade ---------- */
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(227,179,65,.10), transparent 28%),
      radial-gradient(circle at 85% 85%, rgba(70,130,255,.08), transparent 30%),
      var(--bg);
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:32px 32px;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 95%);
  }
  #app{ position:relative; z-index:1; }
  .auth-card, #sidebar, #chat-panel{
    background:rgba(21,27,35,.62);
    backdrop-filter:blur(22px) saturate(130%);
    -webkit-backdrop-filter:blur(22px) saturate(130%);
  }
  .auth-card{
    padding:28px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:24px;
    box-shadow:0 24px 80px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.05);
  }
  .field input, #search-input, #composer-input{
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.08);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .field input:hover, #search-input:hover, #composer-input:hover{
    background:rgba(255,255,255,.065);
    transform:translateY(-1px);
  }
  .field input:focus, #search-input:focus, #composer-input:focus{
    box-shadow:0 0 0 3px rgba(227,179,65,.10);
  }
  #sidebar{ border-right-color:rgba(255,255,255,.08); }
  #sidebar-header, #search-wrap, #chat-header, #composer{
    background:rgba(21,27,35,.42);
    border-color:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
  }
  .conv-item, .search-item, #logout-btn, #send-btn, .btn-primary{
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, filter .2s ease;
  }
  .conv-item:hover{ transform:translateX(4px); box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .search-item:hover{ transform:translateX(3px); }
  #logout-btn:hover{ transform:translateY(-1px); }
  #send-btn:hover, .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(227,179,65,.18);
  }
  #send-btn:active, .btn-primary:active{ transform:scale(.96); }
  .avatar{
    background:linear-gradient(145deg, rgba(227,179,65,.16), rgba(255,255,255,.035));
    box-shadow:inset 0 1px rgba(255,255,255,.07);
  }

  /* Message layout: normal spaces stay inline; only real newlines wrap. */
  #messages{ scroll-behavior:smooth; }
  .msg-row{ animation:messageIn .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes messageIn{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to{ opacity:1; transform:none; }
  }
  .bubble{
    white-space:pre-wrap;
    overflow-wrap:break-word;
    word-break:normal;
    hyphens:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .bubble:hover{ transform:translateY(-1px); box-shadow:0 8px 24px rgba(0,0,0,.14); }
  .msg-row.me .bubble{
    background:linear-gradient(135deg, rgba(34,48,63,.92), rgba(34,48,63,.68));
    box-shadow:inset 0 1px rgba(255,255,255,.04);
  }
  .msg-row.them .bubble{
    background:rgba(29,37,48,.72);
    backdrop-filter:blur(12px);
  }
  .typing-indicator{
    display:flex; align-items:center; gap:4px; width:max-content;
    padding:10px 13px; margin-bottom:6px; border-radius:14px;
    background:rgba(29,37,48,.72); border:1px solid rgba(255,255,255,.07);
    animation:messageIn .25s ease both;
  }
  .typing-indicator span{
    width:5px; height:5px; border-radius:50%; background:var(--muted);
    animation:typingDot 1s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2){animation-delay:.12s}
  .typing-indicator span:nth-child(3){animation-delay:.24s}
  @keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
  .send-status{
    font-size:10px; color:var(--muted); margin-top:3px; min-height:12px;
    animation:statusIn .2s ease both;
  }
  @keyframes statusIn{from{opacity:0}to{opacity:1}}
  .send-status.done{color:var(--online)}
  .send-status.error{color:var(--danger)}
  .send-status.sending::after{content:""; display:inline-block; width:12px; animation:dots 1s steps(3,end) infinite}
  @keyframes dots{0%{content:"."}33%{content:".."}66%,100%{content:"..."}}
  #composer{ align-items:flex-start; }
  #composer-main .send-status{ padding:0 4px; }
  #send-btn:disabled{ cursor:wait; filter:saturate(.55); }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
  @media (max-width:760px){
    .auth-card{padding:24px;border-radius:20px}
  }

</style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <div class="signal-mark"><span></span><span></span><span></span><span></span><span></span></div>
      <h1 id="auth-title">Masuk ke Sinyal</h1>
      <p class="sub" id="auth-sub">Chat langsung, cukup dengan username.</p>
      <div class="error-msg" id="auth-error"></div>
      <div class="field">
        <label>Username</label>
        <input id="auth-username" type="text" autocomplete="username" placeholder="cth. budi_92" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" id="auth-submit">Masuk</button>
      <div class="switch-mode">
        <span id="switch-text">Belum punya akun?</span>
        <button id="switch-btn">Daftar</button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="screen">
    <div id="sidebar">
      <div id="sidebar-header">
        <div class="brand"><span class="dot"></span> Sinyal</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="me-tag"></span>
          <button id="logout-btn">Keluar</button>
        </div>
      </div>
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Cari username..." autocomplete="off" />
        <div id="search-results"></div>
      </div>
      <div id="conv-list"></div>
    </div>

    <div id="chat-panel">
      <div id="chat-empty">
        <div class="signal-mark"><span></span><span></span><span></span><span></span><span></span></div>
        <div>Cari username untuk mulai mengobrol</div>
      </div>
      <div id="chat-header">
        <button id="back-btn">←</button>
        <div class="avatar" id="chat-avatar"></div>
        <div id="chat-title"></div>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <div id="composer-main">
          <textarea id="composer-input" rows="1" placeholder="Tulis pesan..."></textarea>
          <div id="send-status" class="send-status" aria-live="polite"></div>
        </div>
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const state = {
    token: localStorage.getItem('sinyal_token') || null,
    username: localStorage.getItem('sinyal_username') || null,
    mode: 'login', // or 'register'
    activeChat: null,
    pollTimer: null,
    lastMsgCount: 0,
  };

  function api(path, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(path, Object.assign({}, opts, { headers })).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Terjadi kesalahan');
      return data;
    });
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  /* ---------------- AUTH ---------------- */
  function setAuthMode(mode){
    state.mode = mode;
    if (mode === 'login'){
      $('auth-title').textContent = 'Masuk ke Sinyal';
      $('auth-sub').textContent = 'Chat langsung, cukup dengan username.';
      $('auth-submit').textContent = 'Masuk';
      $('switch-text').textContent = 'Belum punya akun?';
      $('switch-btn').textContent = 'Daftar';
    } else {
      $('auth-title').textContent = 'Buat akun';
      $('auth-sub').textContent = 'Pilih username unik, orang lain akan mencarimu dengan ini.';
      $('auth-submit').textContent = 'Daftar';
      $('switch-text').textContent = 'Sudah punya akun?';
      $('switch-btn').textContent = 'Masuk';
    }
    $('auth-error').classList.remove('show');
  }
  $('switch-btn').addEventListener('click', () => setAuthMode(state.mode === 'login' ? 'register' : 'login'));

  $('auth-submit').addEventListener('click', async () => {
    const username = $('auth-username').value.trim();
    const password = $('auth-password').value;
    const errEl = $('auth-error');
    errEl.classList.remove('show');
    if (!username || !password) {
      errEl.textContent = 'Isi username dan password dulu ya.';
      errEl.classList.add('show');
      return;
    }
    $('auth-submit').disabled = true;
    $('auth-submit').textContent = 'Memproses...';
    try {
      const endpoint = state.mode === 'login' ? '/api/login' : '/api/register';
      const data = await api(endpoint, { method: 'POST', body: JSON.stringify({ username, password }) });
      state.token = data.token;
      state.username = data.username;
      localStorage.setItem('sinyal_token', data.token);
      localStorage.setItem('sinyal_username', data.username);
      enterApp();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('show');
    } finally {
      $('auth-submit').disabled = false;
      $('auth-submit').textContent = state.mode === 'login' ? 'Masuk' : 'Daftar';
    }
  });

  ['auth-username','auth-password'].forEach(id => {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('auth-submit').click(); });
  });

  $('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('sinyal_token');
    localStorage.removeItem('sinyal_username');
    state.token = null; state.username = null;
    if (state.pollTimer) clearInterval(state.pollTimer);
    showScreen('auth-screen');
  });

  /* ---------------- APP ---------------- */
  function initials(name){ return name.slice(0,2).toUpperCase(); }

  async function enterApp(){
    $('me-tag').textContent = '@' + state.username;
    showScreen('main-screen');
    loadConversations();
  }

  async function loadConversations(){
    try {
      const data = await api('/api/conversations');
      const list = $('conv-list');
      list.innerHTML = '';
      if (!data.conversations || data.conversations.length === 0){
        list.innerHTML = '<div class="conv-empty-hint">Belum ada obrolan. Cari username di atas untuk memulai chat pertamamu.</div>';
        return;
      }
      data.conversations.forEach(u => list.appendChild(renderConvItem(u)));
    } catch(e){ /* diamkan, mungkin sesi habis */ }
  }

  function renderConvItem(username){
    const div = document.createElement('div');
    div.className = 'conv-item';
    div.dataset.username = username;
    div.innerHTML = `<div class="avatar">${initials(username)}</div><div class="conv-name">@${username}</div>`;
    div.addEventListener('click', () => openChat(username));
    return div;
  }

  /* search */
  let searchDebounce = null;
  $('search-input').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = $('search-input').value.trim();
    const box = $('search-results');
    if (!q){ box.classList.remove('show'); return; }
    searchDebounce = setTimeout(async () => {
      try {
        const data = await api('/api/search?q=' + encodeURIComponent(q));
        box.innerHTML = '';
        if (!data.results || data.results.length === 0){
          box.innerHTML = '<div class="search-empty">Tidak ada username yang cocok</div>';
        } else {
          data.results.forEach(u => {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `<div class="avatar" style="width:28px;height:28px;font-size:11px;">${initials(u)}</div> @${u}`;
            item.addEventListener('click', () => {
              box.classList.remove('show');
              $('search-input').value = '';
              openChat(u);
            });
            box.appendChild(item);
          });
        }
        box.classList.add('show');
      } catch(e){ /* ignore */ }
    }, 250);
  });
  document.addEventListener('click', (e) => {
    if (!$('search-wrap').contains(e.target)) $('search-results').classList.remove('show');
  });

  /* chat */
  async function openChat(username){
    state.activeChat = username;
    state.lastMsgCount = 0;
    $('chat-empty').style.display = 'none';
    $('chat-header').style.display = 'flex';
    $('messages').style.display = 'flex';
    $('composer').style.display = 'flex';
    $('chat-avatar').textContent = initials(username);
    $('chat-title').textContent = '@' + username;
    $('main-screen').classList.add('chat-open');

    document.querySelectorAll('.conv-item').forEach(el => el.classList.toggle('active', el.dataset.username === username));

    await loadMessages(true);
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = setInterval(() => loadMessages(false), 2500);
  }

  $('back-btn').addEventListener('click', () => {
    $('main-screen').classList.remove('chat-open');
  });

  async function loadMessages(scrollBottom){
    if (!state.activeChat) return;
    try {
      const data = await api('/api/messages?with=' + encodeURIComponent(state.activeChat));
      if (data.messages.length === state.lastMsgCount) return;
      state.lastMsgCount = data.messages.length;
      const box = $('messages');
      box.innerHTML = '';
      data.messages.forEach(m => box.appendChild(renderMsg(m)));
      if (scrollBottom !== false) box.scrollTop = box.scrollHeight;
      else box.scrollTop = box.scrollHeight;
    } catch(e){ /* ignore transient errors */ }
  }

  function renderMsg(m){
    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.from === state.username ? 'me' : 'them');
    const time = new Date(m.ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    row.innerHTML = `<div><div class="bubble"></div><div class="msg-time">${time}</div></div>`;
    row.querySelector('.bubble').textContent = m.text; // aman dari XSS
    return row;
  }


  function showTyping(){
    const box = $('messages');
    const old = box.querySelector('.typing-indicator');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return el;
  }

  function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  function setSendStatus(text, type){
    const status = $('send-status');
    status.textContent = text || '';
    status.className = 'send-status' + (type ? ' ' + type : '');
  }

  async function sendMessage(){
    const input = $('composer-input');
    // Jangan menghapus spasi di tengah pesan; trim hanya untuk mengecek pesan kosong.
    const text = input.value.replace(/\r\n/g, '\n');
    if (!text.trim() || !state.activeChat) return;

    const sendBtn = $('send-btn');
    const original = sendBtn.innerHTML;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    sendBtn.style.opacity = '.65';
    setSendStatus('Mengirim', 'sending');

    // Animasi "sedang mengirim" dan waktu kirim 1–3 detik.
    const typing = showTyping();
    const delay = 1000 + Math.floor(Math.random() * 2001);

    try {
      await sleep(delay);
      await api('/api/messages', {
        method: 'POST',
        body: JSON.stringify({ to: state.activeChat, text })
      });
      typing.remove();
      await loadMessages(true);
      loadConversations();
      setSendStatus('Terkirim', 'done');
      setTimeout(() => setSendStatus('', ''), 1800);
    } catch(e){
      typing.remove();
      // Kembalikan pesan ke input agar tidak hilang saat request gagal.
      input.value = text;
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      setSendStatus('Gagal mengirim', 'error');
      alert(e.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.style.opacity = '';
      sendBtn.innerHTML = original;
    }
  }
  $('send-btn').addEventListener('click', sendMessage);
  $('composer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  $('composer-input').addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  /* ---------------- boot ---------------- */
  (async function boot(){
    if (state.token){
      try {
        await api('/api/me');
        enterApp();
        return;
      } catch(e){
        localStorage.removeItem('sinyal_token');
        localStorage.removeItem('sinyal_username');
      }
    }
    setAuthMode('login');
    showScreen('auth-screen');
  })();
})();
</script>
</body>
</html>
